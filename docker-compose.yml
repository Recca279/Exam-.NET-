version: '3.8'

services:
  db:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: comicsystem_sqlserver
    user: root
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Aa12345678!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data:
